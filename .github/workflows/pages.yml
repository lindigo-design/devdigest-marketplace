name: catalog site

# Builds and tests the catalog site on every PR, and deploys it to GitHub Pages on every push to main
# (spec CAT-01 R1/AC-1, R6). No repository secrets are used. Pull requests have no paths filter on purpose: the
# main ruleset requires the three site checks, and a filtered-out PR would wait for them forever.
# A pushed release tag (<plugin>--v<version>, from scripts/tag-release.mjs) rebuilds main, so the plugin page's
# "Download source" link appears once its tag exists (spec CAT-02 R5/AC-4). The github-pages environment must
# allow deployments from tags matching "*--v*" (Settings → Environments → github-pages).
# One-time setup by the owner: Settings → Pages → Source: GitHub Actions.
# Optional repository variables SITE_ORIGIN / SITE_BASE override the origin and base path (R6/AC-5).

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
  SITE_BASE: ${{ vars.SITE_BASE }}

jobs:
  test:
    name: "site: unit + build tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # CHANGELOG history gives feed items their "updated" time (§7); tags for CAT-02 R5
          persist-credentials: false
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }} # a tag push builds main, never an older commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Fonts are current
        run: node scripts/fonts-css.mjs --check
      - name: Unit tests (index builder, search, feeds, token and UI-string lint, budgets)
        run: npm test
      - name: Catalog of this repository
        run: npm run check
      - name: Build tests (fixtures, pages, base-path matrix)
        run: npm run test:build

  build:
    name: "site: build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # CHANGELOG history gives feed items their "updated" time (§7); tags for CAT-02 R5
          persist-credentials: false
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }} # a tag push builds main, never an older commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The "Download source" link appears only for release tags the build can see (CAT-02 R5). A tag push checks
      # out main, and that checkout was observed to leave the tags out, so the deployed pages had no links.
      # Fetch them explicitly (public repository, no credentials needed) and log what the build will see.
      - name: Fetch release tags
        run: |
          git fetch --force --tags origin
          echo "Release tags visible to the build: $(git tag --list '*--v*' | wc -l)"
      - name: Build the site
        run: npm run build
      # Fail instead of deploying a page that silently lacks its download link: every plugin whose current version
      # has a release tag must link to that tag's archive.
      - name: Release tags have download links
        run: |
          set -euo pipefail
          missing=0
          for manifest in ../plugins/*/.claude-plugin/plugin.json; do
            name=$(node -p "require('./' + process.argv[1]).name" "$manifest")
            version=$(node -p "require('./' + process.argv[1]).version" "$manifest")
            tag="${name}--v${version}"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || { echo "no tag yet: ${tag}"; continue; }
            if grep -q "archive/refs/tags/${tag}.zip" "dist/${name}/index.html"; then
              echo "ok: ${name} links ${tag}.zip"
            else
              echo "::error::dist/${name}/index.html has no download link for ${tag}"; missing=1
            fi
          done
          exit "$missing"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  e2e:
    name: "site: browser tests (Playwright + axe)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests against the built demo fixture
        run: npm run e2e
        env:
          CI: "1"
          # The e2e fixture always uses the default origin and base.
          SITE_ORIGIN: ""
          SITE_BASE: ""
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: site/test-results/
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [test, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
